name: Build & Release Android APK

# Auto-compiles the RELEASE APK on every push and publishes a GitHub Release on
# version tags. Debug builds are intentionally disabled — only the signed release
# variant is shipped, which is the same APK the in-app updater downloads.
#
# The in-app updater (update/UpdateChecker.kt) queries the "latest release" of the
# repo configured by GITHUB_REPO_OWNER / GITHUB_REPO_NAME, so tagging a version is
# what makes an update visible inside the app.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # required by gh release create to publish releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper (if missing)
        run: gradle wrapper --gradle-version 8.7

      # Only build the release variant. No debug / test builds are produced — the
      # app is shipped exclusively through GitHub Releases for in-app auto-update.
      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: InsightFaceRecognizer-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # On a version tag (v*), publish a GitHub Release with the release APK attached.
      # The APK filename is normalized to "InsightFaceRecognizer-<tag>.apk" so the
      # in-app updater's .apk asset detection works reliably.
      #
      # `--latest` marks it as the "latest release" so /releases/latest returns it.
      # No `--prerelease` flag → it is a stable release, never a test build.
      #
      # 强制更新：如需强制用户升级，在 release notes 中加入 [FORCE_UPDATE] 标记，
      # 应用检测到后会弹出不可关闭的更新对话框。例如：
      #   gh release create v1.2.0 InsightFaceRecognizer-v1.2.0.apk \
      #     --notes "修复关键安全漏洞 [FORCE_UPDATE]" --latest
      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          APK="app/build/outputs/apk/release/app-release.apk"
          RENAMED="InsightFaceRecognizer-${TAG}.apk"
          cp "$APK" "$RENAMED"
          gh release create "$TAG" "$RENAMED" \
            --title "$TAG" \
            --generate-notes \
            --latest
