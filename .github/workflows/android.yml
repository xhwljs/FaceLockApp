name: Build & Release Android APK

# Auto-compiles the APK on every push and publishes a GitHub Release on version tags.
# The in-app updater (update/UpdateChecker.kt) queries the "latest release" of the repo
# configured by GITHUB_REPO_OWNER / GITHUB_REPO_NAME, so tagging a version is what makes an
# update visible inside the app.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # required by softprops/action-gh-release to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper (if missing)
        run: gradle wrapper --gradle-version 8.7

      - name: Assemble debug + release APK
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: insightface-recognizer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: insightface-recognizer-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # On a version tag (v*), publish a GitHub Release with the release APK attached.
      # The APK filename is normalized to "InsightFaceRecognizer-<tag>.apk" so the in-app
      # updater's .apk asset detection works reliably.
      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          APK="app/build/outputs/apk/release/app-release.apk"
          RENAMED="InsightFaceRecognizer-${TAG}.apk"
          cp "$APK" "$RENAMED"
          gh release create "$TAG" "$RENAMED" \
            --title "$TAG" \
            --generate-notes \
            --latest
